# Render blueprint. Render reads this on first deploy and configures the
# service from it, so the settings below are reviewed here rather than
# clicked into a dashboard nobody can audit later.
#
# CURRENTLY POINTED AT REAL DATA - A DELIBERATE, TEMPORARY CHOICE.
# MONGODB_DATABASE is "zatch" (real customers), not "zatch_demo", because
# this deployment's purpose is a manager review of the fully-working
# assistant, not a public-facing demo. Consequences, accepted knowingly:
#
#   - the link must ONLY be shared privately (e.g. to the manager) -
#     /demo/login lets anyone who reaches it become any real user by
#     username alone, with no password. There is no Basic Auth gate on
#     this deployment - that was a deliberate choice, not an oversight.
#   - real orders, delivery cities and tracking numbers ARE reachable at
#     this URL by anyone who has it
#   - the provider filter drops Groq/Gemini on this database value, so
#     Azure is the ONLY usable provider - see AZURE_OPENAI_* below
#
# Before this link is ever shared beyond one manager, or left running
# unattended, revisit: add HTTP Basic Auth, or repoint MONGODB_DATABASE
# at zatch_demo (see git history for that version of this file).

services:
  - type: web
    name: zatch-assistant
    runtime: docker
    # Closest region to an Indian client and to a Mumbai/Singapore Atlas
    # cluster. Every extra hop shows up in an answer that already takes
    # eight seconds.
    region: singapore

    # STARTER, NOT FREE, AND HERE IS THE TRADE. Render's free web
    # services spin down after ~15 minutes idle, and the next visitor
    # waits roughly a minute for a cold start - on a link sent to a
    # manager to open "whenever", that first impression is the product
    # looking broken. Starter stays warm. Change to `free` if the link
    # is only for a scheduled call you are present for.
    plan: starter

    # Render polls this to decide the service is live. /health returns
    # 200 whenever the app is serving, including when the LLM chain is
    # merely degraded - which is correct: a single-provider warning is
    # not a reason to restart a working service.
    healthCheckPath: /health

    envVars:
      # Set here because they are decisions, not secrets, and they
      # should be visible in review.
      - key: MONGODB_DATABASE
        value: zatch
      # The whole point of this deployment is the page at /demo.
      - key: DEMO_UI_ENABLED
        value: "true"
      # Kept at 1: no REDIS_URL is required below for this single-
      # reviewer deployment, and two workers without Redis means a
      # follow-up question can silently land on a worker that never saw
      # the first message. Raise this only once REDIS_URL is actually set.
      - key: WEB_CONCURRENCY
        value: "1"

      # sync: false means Render prompts for the value once, stores it
      # encrypted, and never writes it into this file or the repository.
      # Nothing secret belongs in git - see .gitignore and .dockerignore.
      - key: MONGODB_URI              # the REAL cluster - read-only service account
        sync: false
      - key: JWT_SECRET                # the app's own test-token signing secret for now
        sync: false
      - key: AZURE_OPENAI_ENDPOINT     # required - real data excludes Groq/Gemini
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: REDIS_URL                 # optional here; omit and WEB_CONCURRENCY stays 1
        sync: false
